submission:
  title: "Sentinel-X: Threat Intelligence Correlation & Alert Prioritisation Assistant"

  problem_statement: >
    Security Operations Centers (SOCs) face overwhelming alert fatigue from thousands of disconnected events across SIEM, satellite, and endpoint telemetry. Analysts struggle to stitch multi-stage attack vectors quickly, often misinterpreting benign space telemetry deviations as cyber incidents.

  solution_summary: >
    Sentinel-X is a modern threat intelligence assistant that normalizes multi-domain telemetry, maps suspicious behavior to the MITRE ATT&CK matrix, correlates chronological multi-stage campaigns, and assesses explainable risk while strictly isolating space telemetry anomalies.

  key_features:
    - "Multi-Domain Event Ingestion & Canonical Normalization across SIEM, Satellite Telemetry, and Sensors"
    - "Real-Time ML Correlation Engine with Chronological Multi-Stage Attack Progression Stitching"
    - "MITRE ATT&CK Intelligence Mapping & Behavioral TTP Enrichment"
    - "Explainable Risk Scoring with Source vs Sentinel-X Priority Discrepancy Analysis"
    - "Interactive BLUF Executive Triage Reporting & High-Throughput Live Event Simulator"

  tech_stack:
    languages: ["TypeScript", "JavaScript", "HTML", "CSS", "Python"]
    frameworks: ["React", "Vite", "Tailwind CSS", "Recharts"]
    ibm_technologies: ["watsonx.ai", "IBM Bob", "IBM Cloud"]
    databases: []
    other: ["Netlify", "GitHub Actions"]

  what_we_are_most_proud_of: >
    The unified multi-domain correlation pipeline and intuitive SaaS user interface that lets a security analyst understand and triage a complex multi-stage attack across SIEM and telemetry within 10 seconds.

  known_limitations: >
    Currently leverages an in-browser high-throughput synthetic simulation engine for realistic live data streaming; direct connectors for enterprise Splunk and Kafka brokers are in roadmap.

